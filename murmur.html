<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Pick a mood, weather and time of day and Murmur builds a living landscape and a calm soundscape to match.">
<meta name="theme-color" content="#0A0F24">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 30 30'%3E%3Crect width='30' height='30' rx='8' fill='%230A0F24'/%3E%3Cpath d='M5 15h2M10 10v10M15 6v18M20 9v12M25 12.5v5' fill='none' stroke='%23FFD9A8' stroke-width='2' stroke-linecap='round'/%3E%3C/svg%3E">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Murmur</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600&family=Instrument+Serif:ital@0;1&display=swap">
<style>
  /* Layout: a full-bleed living landscape behind everything; headline and play controls on the left, a glass dock of three pickers at the bottom. */
  /* This page commits to one look: a scene that is always dark enough for light text, so it does not switch with the device theme. */
  :root {
    color-scheme: dark;
    --bg: #0A0F24;
    --ink: #F3F5FA;
    --ink-2: #C9D0E2;
    --glass: rgba(9, 13, 32, 0.58);
    --line: rgba(255, 255, 255, 0.2);
    --line-strong: rgba(255, 255, 255, 0.5);
    --accent: #FFD9A8;
    --accent-ink: #1B1530;
    --font-display: "Instrument Serif", Georgia, "Times New Roman", serif;
    --font-body: "Hanken Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
  }
  button, input { font: inherit; color: inherit; }
  [hidden] { display: none !important; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  .ui { overflow-x: clip; position: relative; z-index: 1; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; gap: 8px; padding-block: 18px 20px; max-width: 1120px; margin-inline: auto; }
  .top { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
  .brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-size: 30px; line-height: 1; letter-spacing: 0.01em; }
  .brand svg { display: block; }
  .tip { font-size: 13px; color: var(--ink-2); margin: 0; text-align: right; }

  .stage { position: relative; flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: flex-start; gap: 18px; padding-block: 36px 28px; max-width: 760px; }
  .stage::before { content: ""; position: absolute; inset: -10% 0; z-index: -1; background: radial-gradient(closest-side, rgba(5, 8, 22, 0.42), transparent); pointer-events: none; }
  .status { display: flex; align-items: center; gap: 10px; margin: 0; font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--ink-2); }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ink-2); flex: none; }
  .playing .dot { background: var(--accent); box-shadow: 0 0 0 4px rgba(255, 217, 168, 0.25); }
  h1 { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2.9rem, 9.5vw, 6.6rem); line-height: 0.98; letter-spacing: -0.012em; text-wrap: balance; text-shadow: 0 2px 30px rgba(5, 8, 22, 0.45); }
  h1 em { font-style: italic; color: var(--accent); }
  .hears { margin: 0; max-width: 54ch; font-size: 17px; color: var(--ink); text-shadow: 0 1px 14px rgba(5, 8, 22, 0.6); }
  .hears span { color: var(--ink-2); }
  .swap { animation: fadein 0.5s ease-out; }
  @keyframes fadein { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }

  .controls { display: flex; flex-wrap: wrap; align-items: center; gap: 14px 20px; margin-top: 4px; }
  .play { display: flex; align-items: center; gap: 14px; background: none; border: 0; padding: 0; cursor: pointer; }
  .play .disc { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); color: var(--accent-ink); display: grid; place-items: center; transition: transform 0.2s ease; }
  .play:hover .disc { transform: scale(1.05); }
  .play .word { font-size: 18px; font-weight: 500; }
  .playing .play .disc { animation: breathe 3.6s ease-in-out infinite; }
  @keyframes breathe { 0%, 100% { box-shadow: 0 0 0 0 rgba(255, 217, 168, 0.35); } 50% { box-shadow: 0 0 0 16px rgba(255, 217, 168, 0); } }
  .vol { display: flex; align-items: center; gap: 10px; color: var(--ink-2); }
  .vol input { width: 130px; accent-color: var(--accent); }
  .ghost { background: rgba(9, 13, 32, 0.4); border: 1px solid var(--line); border-radius: 999px; padding: 9px 16px; cursor: pointer; font-size: 14px; min-height: 40px; }
  .ghost:hover { border-color: var(--line-strong); }
  :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
  .note { margin: 0; font-size: 14px; color: var(--accent); }

  .dock { display: grid; grid-template-columns: repeat(3, auto); justify-content: space-between; gap: 18px 28px; background: var(--glass); border: 1px solid var(--line); border-radius: 22px; padding: 18px 20px; -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); }
  .group { min-width: 0; border: 0; margin: 0; padding: 0; }
  .group legend { padding: 0; margin-bottom: 10px; font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-2); }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip { position: relative; }
  .chip input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
  .chip span { display: block; padding: 8px 15px; min-height: 40px; line-height: 22px; border: 1px solid var(--line); border-radius: 999px; font-size: 15px; transition: background 0.2s ease, color 0.2s ease, border-color 0.2s ease; }
  .chip:hover span { border-color: var(--line-strong); }
  .chip input:checked + span { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 500; }
  .chip input:focus-visible + span { outline: 2px solid var(--ink); outline-offset: 3px; }

  @media (max-width: 860px) { .dock { grid-template-columns: minmax(0, 1fr); } .tip { display: none; } }
  @media (max-width: 560px) {
    .ui { padding-block: 14px 16px; }
    .stage { padding-block: 28px 20px; }
    .play .disc { width: 66px; height: 66px; }
    .vol input { width: 110px; }
    .dock { padding: 16px; border-radius: 18px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .swap, .playing .play .disc { animation: none; }
    .chip span, .play .disc { transition: none; }
  }
</style>
</head>
<body>
<canvas id="scene" aria-hidden="true"></canvas>

<div class="ui" id="ui">
  <header class="top">
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 30 30" fill="none" stroke="#FFD9A8" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M3 15h2.5M9 10v10M14 5v20M19 9v12M24.5 12.5v5"></path>
      </svg>
      <span>Murmur</span>
    </div>
    <p class="tip">Best with headphones</p>
  </header>

  <main class="stage" id="stage">
    <p class="status"><span class="dot"></span><span id="status-text">Press play to begin</span></p>
    <h1 id="headline"></h1>
    <p class="hears" id="hears"></p>
    <div class="controls">
      <button class="play" id="play" type="button" aria-pressed="false">
        <span class="disc">
          <svg id="play-icon" width="30" height="30" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M8 5.5v13l11-6.5z"></path></svg>
        </span>
        <span class="word" id="play-word">Play</span>
      </button>
      <label class="vol"><span class="sr">Volume</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 9.5h3.5L12 5.5v13l-4.5-4H4z"></path><path d="M15.5 9a4 4 0 010 6M18 6.5a7.5 7.5 0 010 11"></path></svg>
        <input id="vol" type="range" min="0" max="100" step="1" value="70">
      </label>
      <button class="ghost" id="timer" type="button">Sleep timer: off</button>
      <button class="ghost" id="surprise" type="button">Surprise me</button>
    </div>
    <p class="note" id="note" role="status" hidden></p>
  </main>

  <section class="dock" aria-label="Choose your scene">
    <fieldset class="group"><legend>Mood</legend><div class="chips" id="g-mood"></div></fieldset>
    <fieldset class="group"><legend>Weather</legend><div class="chips" id="g-weather"></div></fieldset>
    <fieldset class="group"><legend>Time of day</legend><div class="chips" id="g-time"></div></fieldset>
  </section>
  <div class="sr" id="live" aria-live="polite"></div>
</div>

<script>
(() => {
  "use strict";

  // ───────────────────────── Helpers ─────────────────────────
  const $ = (id) => document.getElementById(id);
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = (a) => a[Math.floor(Math.random() * a.length)];
  const expo = (r) => -Math.log(1 - Math.random()) / r;
  const mtof = (m) => 440 * Math.pow(2, (m - 69) / 12);
  const RM = !!(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);

  const OPTIONS = {
    mood: [["focus", "Focus"], ["calm", "Calm"], ["cozy", "Cozy"], ["dreamy", "Dreamy"]],
    weather: [["clear", "Clear"], ["rain", "Rain"], ["storm", "Storm"], ["snow", "Snow"], ["wind", "Wind"]],
    time: [["dawn", "Dawn"], ["day", "Day"], ["dusk", "Dusk"], ["night", "Night"]]
  };
  const WEATHER_PHRASE = { clear: "Clear skies", rain: "Soft rain", storm: "Distant thunder", snow: "Quiet snowfall", wind: "Wind in the grass" };
  const TIME_PHRASE = { dawn: "at first light.", day: "in the afternoon.", dusk: "at dusk.", night: "after dark." };
  const STORE_KEY = "murmur.v1";
  const state = { mood: "calm", weather: "rain", time: "dusk", vol: 0.7 };

  // ───────────────────────── What the scene sounds like ─────────────────────────
  // One function decides every layer, so the sound, the picture and the "you'll hear" line always agree.
  const ROOT = { dawn: 50, day: 55, dusk: 52, night: 45 };
  const PAD = {
    focus: { type: "sine", cut: 520, dur: 18, step: 0.7, att: 6, rel: 7, peak: 0.075, send: 0.3, oct: -12, detune: [0],
      prog: [{ r: 0, n: [0, 7] }, { r: 0, n: [0, 7, 12] }] },
    calm: { type: "triangle", cut: 1100, dur: 13, step: 0.62, att: 4, rel: 5, peak: 0.075, send: 0.45, oct: 0, detune: [0],
      prog: [{ r: 0, n: [0, 4, 7, 14] }, { r: -3, n: [0, 3, 7, 10] }, { r: -7, n: [0, 4, 7, 11] }, { r: -5, n: [0, 4, 7, 14] }] },
    cozy: { type: "triangle", cut: 850, dur: 14, step: 0.6, att: 4.5, rel: 5.5, peak: 0.075, send: 0.4, oct: -12, detune: [-5, 5],
      prog: [{ r: 0, n: [0, 4, 7, 11] }, { r: 2, n: [0, 3, 7, 10] }, { r: 5, n: [0, 4, 7, 11] }, { r: -3, n: [0, 3, 7, 10] }] },
    dreamy: { type: "sine", cut: 2400, dur: 15, step: 0.55, att: 5, rel: 6, peak: 0.07, send: 0.65, oct: 0, detune: [-8, 8],
      prog: [{ r: 0, n: [0, 4, 7, 11, 18] }, { r: 2, n: [0, 4, 7, 11, 14] }, { r: -5, n: [0, 4, 7, 11, 14] }, { r: 7, n: [0, 4, 7, 14, 18] }] }
  };
  const PAD_LABEL = { focus: "a low steady drone", calm: "a soft pad", cozy: "a warm pad", dreamy: "a shimmering pad" };

  function plan(s) {
    const { mood, weather: w, time: t } = s;
    const open = w === "clear" || w === "wind";
    const levels = { rain: 0, rainLow: 0, wind: 0, whistle: 0, hush: 0, fire: 0 };
    const rates = { drop: 0, crackle: 0, cricket: 0, bird: 0, owl: 0, chime: 0, thunder: 0 };
    const layers = [];
    if (w === "rain") { levels.rain = 0.34; levels.rainLow = 0.12; rates.drop = 7; layers.push("rain on leaves"); }
    if (w === "storm") { levels.rain = 0.4; levels.rainLow = 0.22; rates.drop = 12; rates.thunder = 1 / 16; layers.push("heavy rain", "rolling thunder"); }
    levels.wind = { wind: 0.55, storm: 0.32, snow: 0.16, rain: 0.08, clear: t === "day" ? 0.1 : 0.08 }[w];
    levels.whistle = { wind: 0.07, storm: 0.04, snow: 0.02 }[w] || 0;
    if (w === "wind") layers.push("wind through the grass");
    if (w === "clear") layers.push("a light breeze");
    if (w === "snow") { levels.hush = 0.06; layers.push("hushed, snowy air"); }
    const k = w === "wind" ? 0.5 : 1;
    if (open) {
      if (t === "night") rates.cricket = 3.2 * k;
      if (t === "dusk") rates.cricket = 1.6 * k;
      rates.bird = { dawn: 0.6, day: 0.14, dusk: 0.07, night: 0 }[t] * k;
      if (t === "night") rates.owl = 0.04 * k;
      if (rates.cricket) layers.push("crickets");
      if (rates.bird) layers.push(rates.bird >= 0.3 ? "birdsong" : "distant birds");
      if (rates.owl) layers.push("a distant owl");
    }
    rates.chime = (w === "snow" ? 0.14 : 0) + (mood === "dreamy" ? 0.2 : 0);
    if (rates.chime) layers.push(w === "snow" && mood !== "dreamy" ? "faint bells" : "glass chimes");
    if (mood === "cozy") { levels.fire = 0.22; rates.crackle = 9; layers.push("a crackling fire"); }
    layers.push(PAD_LABEL[mood]);
    return { levels, rates, layers };
  }

  // ───────────────────────── Sound engine (Web Audio, nothing downloaded) ─────────────────────────
  function makeNoise(ctx, type, secs) {
    const sr = ctx.sampleRate, xf = Math.floor(sr * 0.15), n = Math.floor(sr * secs);
    const buf = ctx.createBuffer(2, n, sr);
    for (let c = 0; c < 2; c++) {
      const raw = new Float32Array(n + xf);
      let b0 = 0, b1 = 0, b2 = 0, b3 = 0, b4 = 0, b5 = 0, b6 = 0, last = 0, peak = 0;
      for (let i = 0; i < raw.length; i++) {
        const w = Math.random() * 2 - 1; let v;
        if (type === "white") v = w;
        else if (type === "pink") {
          b0 = 0.99886 * b0 + w * 0.0555179; b1 = 0.99332 * b1 + w * 0.0750759; b2 = 0.969 * b2 + w * 0.153852;
          b3 = 0.8665 * b3 + w * 0.3104856; b4 = 0.55 * b4 + w * 0.5329522; b5 = -0.7616 * b5 - w * 0.016898;
          v = b0 + b1 + b2 + b3 + b4 + b5 + b6 + w * 0.5362; b6 = w * 0.115926;
        } else { last = (last + 0.02 * w) / 1.02; v = last * 3.5; }
        raw[i] = v; const a = Math.abs(v); if (a > peak) peak = a;
      }
      const d = buf.getChannelData(c), g = peak > 0 ? 0.95 / peak : 1;
      for (let i = 0; i < n; i++) {
        let v = raw[i];
        if (i < xf) { const p = (i / xf) * Math.PI / 2; v = v * Math.sin(p) + raw[n + i] * Math.cos(p); }   // seamless loop
        d[i] = v * g;
      }
    }
    return buf;
  }
  function makeBurst(ctx, secs, tau) {
    const sr = ctx.sampleRate, n = Math.floor(sr * secs), buf = ctx.createBuffer(1, n, sr), d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.exp(-i / (sr * tau));
    return buf;
  }
  function makeImpulse(ctx, secs) {
    const sr = ctx.sampleRate, n = Math.floor(sr * secs), buf = ctx.createBuffer(2, n, sr);
    for (let c = 0; c < 2; c++) {
      const d = buf.getChannelData(c); let y = 0;
      for (let i = 0; i < n; i++) {
        const u = i / n, x = (Math.random() * 2 - 1) * Math.pow(1 - u, 2.8) * (i < 400 ? i / 400 : 1);
        y += (x - y) * (0.12 + 0.6 * (1 - u));       // the tail gets darker as it fades
        d[i] = y;
      }
    }
    return buf;
  }

  const MASTER_SCALE = 1.0;
  function createEngine(ctx, hooks) {
    hooks = hooks || {};
    const master = ctx.createGain(); master.gain.value = 0;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -16; comp.knee.value = 18; comp.ratio.value = 3.5; comp.attack.value = 0.01; comp.release.value = 0.35;
    master.connect(comp); comp.connect(ctx.destination);
    const dry = ctx.createGain(); dry.connect(master);
    const verbIn = ctx.createGain(), verb = ctx.createConvolver(), verbOut = ctx.createGain();
    verb.buffer = makeImpulse(ctx, 3.2); verbOut.gain.value = 0.9;
    verbIn.connect(verb); verb.connect(verbOut); verbOut.connect(master);

    const noise = { pink: makeNoise(ctx, "pink", 7), brown: makeNoise(ctx, "brown", 7) };
    const dropBuf = makeBurst(ctx, 0.05, 0.008), popBuf = makeBurst(ctx, 0.02, 0.003), crackBuf = makeBurst(ctx, 0.6, 0.09);
    const loop = (buf) => { const s = ctx.createBufferSource(); s.buffer = buf; s.loop = true; s.start(0, Math.random() * (buf.duration - 0.2)); return s; };
    const filt = (type, f, q) => { const b = ctx.createBiquadFilter(); b.type = type; b.frequency.value = f; if (q) b.Q.value = q; return b; };
    const gainNode = (v, to) => { const g = ctx.createGain(); g.gain.value = v; if (to) g.connect(to); return g; };
    const panner = (p) => { if (ctx.createStereoPanner) { const n = ctx.createStereoPanner(); n.pan.value = p; return n; } return ctx.createGain(); };
    const lfo = (rate, depth, param) => { const o = ctx.createOscillator(); o.frequency.value = rate; const g = gainNode(depth); o.connect(g); g.connect(param); o.start(); };

    const G = {};   // steady layers, each fades toward its level when the scene changes
    for (const k of ["rain", "rainLow", "wind", "whistle", "hush", "fire"]) G[k] = gainNode(0, dry);
    loop(noise.pink).connect(filt("highpass", 700)).connect(filt("lowpass", 7500)).connect(G.rain);
    loop(noise.brown).connect(filt("lowpass", 420)).connect(G.rainLow);
    const windBand = filt("bandpass", 380, 0.7), swell = gainNode(0.65);
    loop(noise.brown).connect(windBand); windBand.connect(swell); swell.connect(G.wind);
    lfo(0.07, 220, windBand.frequency); lfo(0.11, 0.35, swell.gain);
    const whistleBand = filt("bandpass", 900, 9);
    loop(noise.pink).connect(whistleBand); whistleBand.connect(G.whistle); lfo(0.05, 260, whistleBand.frequency);
    loop(noise.pink).connect(filt("lowpass", 900)).connect(G.hush);
    loop(noise.brown).connect(filt("lowpass", 140)).connect(G.fire);

    const padFilter = filt("lowpass", 900), padBus = gainNode(1, dry), padSend = gainNode(0.4, verbIn);
    padFilter.connect(padBus); padFilter.connect(padSend);

    let S = { mood: "calm", weather: "rain", time: "dusk" }, P = plan(S);
    const next = {}; let padNext = 0, progIdx = 0;

    function out(node, wet) {
      node.connect(dry);
      if (wet > 0) { const s = gainNode(wet, verbIn); node.connect(s); }
    }
    function oneShot(buf, t, f, q, peak, p, wet) {
      const src = ctx.createBufferSource(); src.buffer = buf;
      const b = filt("bandpass", f, q), g = gainNode(peak), pn = panner(p);
      src.connect(b); b.connect(g); g.connect(pn); out(pn, wet || 0); src.start(t);
    }

    const events = {
      drop(t) { oneShot(dropBuf, t, rand(1200, 5200), 1.2, rand(0.05, 0.16) * (S.weather === "storm" ? 1.2 : 1), rand(-0.9, 0.9), 0.05); },
      crackle(t) {
        const n = Math.random() < 0.35 ? Math.floor(rand(2, 5)) : 1;
        for (let i = 0; i < n; i++) oneShot(popBuf, t + i * rand(0.01, 0.06), rand(1500, 6000), 0.8, rand(0.05, 0.3), rand(-0.5, 0.5), 0);
      },
      cricket(t) {
        const f = pick([4200, 4500, 4850]) + rand(-60, 60), pulses = pick([3, 3, 4]), gap = 0.052;
        const o = ctx.createOscillator(); o.type = "sine"; o.frequency.value = f;
        const g = ctx.createGain(); g.gain.setValueAtTime(0, t);
        for (let i = 0; i < pulses; i++) { const s = t + i * gap; g.gain.linearRampToValueAtTime(0.03, s + 0.006); g.gain.linearRampToValueAtTime(0, s + 0.03); }
        const pn = panner(rand(-0.9, 0.9)); o.connect(g); g.connect(pn); out(pn, 0.08);
        o.start(t); o.stop(t + pulses * gap + 0.05);
      },
      bird(t) {
        const trill = Math.random() < 0.3, k = trill ? Math.floor(rand(6, 10)) : Math.floor(rand(2, 6)), f0 = rand(2200, 4200);
        const pn = panner(rand(-0.9, 0.9)); out(pn, 0.25);
        let s = t;
        for (let i = 0; i < k; i++) {
          const len = trill ? 0.04 : rand(0.05, 0.12), f = trill ? f0 * (i % 2 ? 1.08 : 1) : f0 * rand(0.85, 1.2);
          const o = ctx.createOscillator(); o.type = "sine"; o.frequency.setValueAtTime(f, s);
          o.frequency.exponentialRampToValueAtTime(f * (trill ? 1.04 : rand(0.7, 1.35)), s + len);
          const g = ctx.createGain(); g.gain.setValueAtTime(0, s); g.gain.linearRampToValueAtTime(0.05, s + 0.008); g.gain.linearRampToValueAtTime(0, s + len + 0.02);

        const n = Math.floor(flies.length * I.ff * cheap);
        for (let i = 0; i < n; i++) {
          const p = flies[i]; p.a += (Math.random() - 0.5) * dt * 3; p.x += Math.cos(p.a) * 0.02 * p.sp * dt * SP; p.y += Math.sin(p.a) * 0.02 * p.sp * dt * SP;
          if (p.x < 0 || p.x > 1) p.x = (p.x + 1) % 1; p.y = clamp(p.y, 0.5, 0.96);
          const a = Math.pow(Math.max(0, Math.sin(clock * p.sp * 1.4 + p.ph)), 2) * I.ff, r = 14 * U;
          g.globalAlpha = a * 0.9; g.drawImage(glowWarm, p.x * W - r, p.y * H - r, r * 2, r * 2);
        }
        g.globalAlpha = 1;
      }
      if (I.mote > 0.02) {
        const n = Math.floor(motes.length * I.mote * cheap);
        for (let i = 0; i < n; i++) {
          const p = motes[i]; p.ph += dt * 0.5; p.x += (0.01 + Math.sin(p.ph) * 0.006) * p.sp * dt * SP; p.y += Math.cos(p.ph * 0.7) * 0.004 * dt * SP; if (p.x > 1.02) p.x = -0.02;
          const r = 7 * U; g.globalAlpha = 0.35 * I.mote; g.drawImage(glowSoft, p.x * W - r, p.y * H - r, r * 2, r * 2);
        }
        g.globalAlpha = 1;
      }

      // lightning
      if (flash > 0.01) {
        if (bolt && !RM) {
          g.strokeStyle = "rgba(235,240,255," + clamp(flash, 0, 1).toFixed(3) + ")"; g.lineWidth = 2.4 * U; g.lineJoin = "round"; g.beginPath();
          bolt.forEach((p, i) => (i ? g.lineTo(p[0] * W, p[1] * H) : g.moveTo(p[0] * W, p[1] * H))); g.stroke();
        }
        g.fillStyle = "rgba(215,225,255," + (flash * (RM ? 0.12 : 0.5)).toFixed(3) + ")"; g.fillRect(0, 0, W, H);
        flash *= Math.exp(-dt * 6);
      }
      // edges
      const vg = g.createRadialGradient(W / 2, H * 0.45, Math.min(W, H) * 0.35, W / 2, H * 0.45, Math.max(W, H) * 0.8);
      vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,0.38)"); g.fillStyle = vg; g.fillRect(0, 0, W, H);
    }

    function frame(ts) {
      if (!running) return;
      const dt = Math.min(0.05, (ts - last) / 1000 || 0.016); last = ts; clock += dt;
      approach(1 - Math.exp(-dt * 1.4)); const k = 1 - Math.exp(-dt * 1.1);
      for (const key in I) I[key] += (IT[key] - I[key]) * k;
      px += (pxT - px) * (1 - Math.exp(-dt * 3));
      draw(dt); requestAnimationFrame(frame);
    }
    window.addEventListener("resize", resize);
    window.addEventListener("pointermove", (e) => { if (!RM) pxT = (e.clientX / (W || 1)) * 2 - 1; }, { passive: true });
    resize();
    return {
      set(s) { target(s); },
      start() { if (running) return; running = true; last = performance.now(); requestAnimationFrame(frame); },
      lightning() {
        flash = 1;
        if (!RM) { let x = rand(0.15, 0.85), y = 0; bolt = [[x, y]]; while (y < ridgeY(1, x * W) / H - 0.02) { x += rand(-0.03, 0.03); y += rand(0.03, 0.07); bolt.push([x, y]); } setTimeout(() => { flash = Math.max(flash, 0.7); }, 90); }
      }
    };
  }

  // ───────────────────────── Page controls ─────────────────────────
  const scene = createScene($("scene"));
  let ctx = null, engine = null, sched = null, clockId = null, lastEnd = 0, timerMin = 0, timerEnd = 0, isPlaying = false;

  try { const saved = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (saved) { for (const k of ["mood", "weather", "time"]) if (OPTIONS[k].some((o) => o[0] === saved[k])) state[k] = saved[k]; if (typeof saved.vol === "number") state.vol = clamp(saved.vol, 0, 1); } } catch (e) { /* storage may be blocked */ }
  const save = () => { try { localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ } };

  function buildGroup(key) {
    const box = $("g-" + key);
    for (const [val, label] of OPTIONS[key]) {
      const l = document.createElement("label"); l.className = "chip";
      const i = document.createElement("input"); i.type = "radio"; i.name = key; i.value = val; i.checked = state[key] === val;
      i.addEventListener("change", () => { state[key] = val; apply(true); });
      const s = document.createElement("span"); s.textContent = label; l.append(i, s); box.append(l);
    }
  }
  ["mood", "weather", "time"].forEach(buildGroup);

  function renderText(animate) {
    const h = $("headline"), hears = $("hears"), p = plan(state);
    h.textContent = ""; const a = document.createElement("span"); a.textContent = WEATHER_PHRASE[state.weather] + " "; const e = document.createElement("em"); e.textContent = TIME_PHRASE[state.time]; h.append(a, e);
    const list = p.layers.join(" · "); hears.textContent = ""; const lab = document.createElement("span"); lab.textContent = "You'll hear "; hears.append(lab, document.createTextNode(list + "."));
    if (animate && !RM) for (const n of [h, hears]) { n.classList.remove("swap"); void n.offsetWidth; n.classList.add("swap"); }
  }
  function apply(fromUser) {
    renderText(true); scene.set(state); save();
    if (engine) engine.setScene(state);
    if (fromUser) $("live").textContent = WEATHER_PHRASE[state.weather] + " " + TIME_PHRASE[state.time].replace(".", "") + ", " + state.mood + " mood.";
    for (const k of ["mood", "weather", "time"]) document.querySelectorAll('input[name="' + k + '"]').forEach((i) => { i.checked = i.value === state[k]; });
  }

  function setPlayingUI() {
    $("ui").classList.toggle("playing", isPlaying);
    $("play").setAttribute("aria-pressed", String(isPlaying));
    $("play-word").textContent = isPlaying ? "Pause" : "Play";
    $("play-icon").innerHTML = isPlaying ? '<path d="M7 5h3.5v14H7zM13.5 5H17v14h-3.5z"></path>' : '<path d="M8 5.5v13l11-6.5z"></path>';
    $("status-text").textContent = isPlaying ? "Now playing" : "Press play to begin";
    updateTimerUI();
  }
  function showNote(msg) { const n = $("note"); n.textContent = msg || ""; n.hidden = !msg; }

  async function play() {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) { showNote("This browser can't play synthesized sound. Try a recent Chrome, Safari or Firefox."); return; }
    showNote("");
    try {
      ctx = new AC(); engine = createEngine(ctx, { flash: (ms) => setTimeout(() => scene.lightning(), ms) });
      if (ctx.state === "suspended") await ctx.resume();
      engine.setScene(state); engine.fadeIn(state.vol);
      lastEnd = ctx.currentTime;
      const tick = () => { if (!ctx) return; const end = ctx.currentTime + 2; if (end > lastEnd) { engine.scheduleWindow(lastEnd, end); lastEnd = end; } };
      tick(); sched = setInterval(tick, 250);
      if (timerMin) timerEnd = Date.now() + timerMin * 60000;
      clockId = setInterval(() => { if (timerEnd && Date.now() >= timerEnd) pause(8); else updateTimerUI(); }, 1000);
      isPlaying = true; setPlayingUI();
      if (ctx.state !== "running") showNote("Your browser is holding the sound back. Tap Play once more.");
    } catch (e) { engine = null; ctx = null; isPlaying = false; setPlayingUI(); showNote("Couldn't start the sound on this device."); }
  }
  function pause(sec) {
    clearInterval(sched); clearInterval(clockId); timerEnd = 0;
    const e = engine; engine = null; ctx = null; isPlaying = false; setPlayingUI();
    if (e) e.stop(sec == null ? 1.2 : sec);
  }
  $("play").addEventListener("click", () => (isPlaying ? pause() : play()));
  $("vol").value = Math.round(state.vol * 100);
  $("vol").addEventListener("input", (ev) => { state.vol = ev.target.value / 100; save(); if (engine) engine.setVolume(state.vol); });
  const TIMERS = [0, 15, 30, 60];
  function updateTimerUI() {
    const b = $("timer");
    if (!timerMin) b.textContent = "Sleep timer: off";
    else if (isPlaying && timerEnd) b.textContent = "Stops in " + Math.max(1, Math.ceil((timerEnd - Date.now()) / 60000)) + " min";
    else b.textContent = "Sleep timer: " + timerMin + " min";
  }
  $("timer").addEventListener("click", () => { timerMin = TIMERS[(TIMERS.indexOf(timerMin) + 1) % TIMERS.length]; timerEnd = isPlaying && timerMin ? Date.now() + timerMin * 60000 : 0; updateTimerUI(); });
  $("surprise").addEventListener("click", () => { for (const k of ["mood", "weather", "time"]) state[k] = pick(OPTIONS[k])[0]; apply(true); });
  document.addEventListener("keydown", (e) => { if (e.code === "Space" && (e.target === document.body || e.target === document.documentElement)) { e.preventDefault(); $("play").click(); } });

  apply(false); scene.start(); setPlayingUI();
  
})();
</script>
</body>
</html>
